name: Support for another agent
description: Ask for (or offer to write) an adapter for a new AI agent
labels: [adapter]
body:
  - type: input
    id: agent
    attributes:
      label: Agent name and link
    validations:
      required: true
  - type: textarea
    id: hooks
    attributes:
      label: How can it report what it's doing?
      description: Hooks, notify command, log file, API… Link the docs. See src/adapters/README.md.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a PR for this adapter
